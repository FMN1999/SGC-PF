<app-header></app-header>
<div class="crear-material-container">
  <h1>Crear Material</h1>
  <form [formGroup]="materialForm" (ngSubmit)="crearMaterial()">
    <div class="form-group">
      <label for="nombre">Denominación: <span class="required-asterisk">*</span></label>
      <input id="nombre" formControlName="nombre" required />
    </div>

    <div class="form-group">
      <label for="unidad_medida">Unidad de Medida: <span class="required-asterisk">*</span></label>
      <input id="unidad_medida" formControlName="unidad_medida" required />
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción: <span class="required-asterisk">*</span></label>
      <textarea id="descripcion" formControlName="descripcion" required></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="precio">Precio:</label>
        <input id="precio" formControlName="precio" type="number" step="0.01" />
      </div>

      <div class="form-group">
        <label for="moneda">Moneda:</label>
        <input id="moneda" formControlName="moneda" />
      </div>
    </div>

    <div class="form-group">
      <label for="marca">Marca:</label>
      <input id="marca" formControlName="marca" />
    </div>

    <div class="form-group">
      <label for="fecha_desde_precio">Fecha Desde Precio:</label>
      <input id="fecha_desde_precio" formControlName="fecha_desde_precio" type="date" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="impuestos_total">Impuestos:</label>
        <input id="impuestos_total" formControlName="impuestos_total" type="number" step="0.01" />
      </div>

      <div class="form-group">
        <label for="moneda_impuestos">Moneda Impuestos:</label>
        <input id="moneda_impuestos" formControlName="moneda_impuestos" />
      </div>
    </div>

    <div class="form-group">
      <label for="descripcion_impuestos">Descripción Impuestos:</label>
      <textarea id="descripcion_impuestos" formControlName="descripcion_impuestos"></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="otros_gastos">Otros gastos:</label>
        <input id="otros_gastos" formControlName="otros_gastos" type="number" step="0.01" />
      </div>

      <div class="form-group">
        <label for="moneda_otros_gastos">Moneda de Otros gastos:</label>
        <input id="moneda_otros_gastos" formControlName="moneda_otros_gastos" />
      </div>
    </div>

    <div class="form-group">
      <label for="descripcion_otros_gastos">Descripción de otros gastos:</label>
      <textarea id="descripcion_otros_gastos" formControlName="descripcion_otros_gastos"></textarea>
    </div>

    <div class="form-group">
      <label>Asociar con:</label>
      <select formControlName="tipoAsociacion">
        <option value="">Ninguno</option>
        <option value="vehiculo">Vehículo</option>
        <option value="herramienta">Herramienta</option>
      </select>
    </div>

    <div *ngIf="materialForm.get('tipoAsociacion')?.value === 'vehiculo'" class="association-form">
      <h2>Datos del Vehículo</h2>
      <div [formGroup]="vehiculoForm">
        <div class="form-group">
          <label for="patente">Patente:</label>
          <input id="patente" formControlName="patente" />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo:</label>
          <input id="tipo" formControlName="tipo" />
        </div>

        <div class="form-group">
          <label for="modelo">Modelo:</label>
          <input id="modelo" formControlName="modelo" />
        </div>

        <div class="form-group">
          <label for="precio_x_hora">Precio por hora:</label>
          <input id="precio_x_hora" formControlName="precio_x_hora" type="number" step="0.01" />
        </div>

        <div class="form-group">
          <label>Almacén:</label>
          <select formControlName="id_almacen">
            <option value="">Seleccione un almacén</option>
            <option *ngFor="let almacen of almacenes" [value]="almacen.id">
              {{ almacen.descripcion }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <div *ngIf="materialForm.get('tipoAsociacion')?.value === 'herramienta'" class="association-form">
      <h2>Datos de la Herramienta</h2>
      <div [formGroup]="herramientaForm">
        <div class="form-group">
          <label for="ubicacion">Ubicación:</label>
          <input id="ubicacion" formControlName="ubicacion" />
        </div>

        <div class="form-group">
          <label>Almacén:</label>
          <select formControlName="id_almacen">
            <option value="">Seleccione un almacén</option>
            <option *ngFor="let almacen of almacenes" [value]="almacen.id">
              {{ almacen.descripcion }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <button class="submit-btn" type="submit" [disabled]="materialForm.invalid">Crear Material</button>
  </form>

  <div *ngIf="mensajeError" class="error">{{ mensajeError }}</div>
  <div *ngIf="mensajeSuccess" class="success">{{ mensajeSuccess }}</div>
</div>
