<app-header></app-header>
<div class="registrar-pago-container">
  <h3>Registrar Pago</h3>

  <form [formGroup]="pagoForm" (ngSubmit)="registrarPago()">
    <div>
      <label for="tipo_pago">Tipo de Pago:</label>
      <select id="tipo_pago" formControlName="tipo_pago">
        <option value="">Seleccione un tipo de pago</option>
        <option value="compra">Compra</option>
        <option value="subcontratacion">Contratación</option>
        <option value="proveedor_directo">Proveedor Directo</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="monto">Monto: <span class="required-asterisk">*</span></label>
        <input id="monto" formControlName="monto" type="number" required />
      </div>

      <div class="form-group">
        <label for="moneda">Moneda: <span class="required-asterisk">*</span></label>
        <input id="moneda" formControlName="moneda" type="text" required />
      </div>
    </div>

    <div>
      <label for="cuota">Nro. de Cuota: <span class="required-asterisk">*</span></label>
      <input id="cuota" formControlName="cuota" type="number" required />
    </div>

    <div>
      <label for="fecha_pago">Fecha de pago: <span class="required-asterisk">*</span></label>
      <input id="fecha_pago" formControlName="fecha_pago" type="date" required />
    </div>

    <label for="id_proveedor">Proveedor:</label>
    <select id="id_proveedor" formControlName="id_proveedor">
      <option value="">Seleccione un proveedor</option>
      <option *ngFor="let proveedor of proveedores" [value]="proveedor.id"
              [disabled]="tipoPagoSeleccionado === 'Compra' || tipoPagoSeleccionado === 'Contratacion'">
        {{ proveedor.denominacion }}
      </option>
    </select>


    <div *ngIf="tipoPagoSeleccionado === 'compra'" class="conditional-field">
      <label for="id_compra">Compra:</label>
      <select id="id_compra" formControlName="id_compra">
        <option value="" disabled selected>Seleccione una compra</option>
        <option *ngFor="let compra of comprasPendientes" [value]="compra.id">
          {{ compra.direccion_obra || 'Sin obra asignada' }} - {{ compra.fecha_compra | date }}
          ({{ compra.cantidad_lineas }} líneas - {{ compra.materiales.join(', ') }})
        </option>
      </select>
    </div>

    <div *ngIf="tipoPagoSeleccionado === 'subcontratacion'" class="conditional-field">
      <label for="id_subcontratacion">Contratación:</label>
      <select id="id_subcontratacion" formControlName="id_subcontratacion">
        <option value="">Seleccione una contratación</option>
        <option *ngFor="let subcontratacion of subcontrataciones" [value]="subcontratacion.id">
          {{ subcontratacion.obra }} - {{ subcontratacion.fecha_contrato }} - {{ subcontratacion.descripcion_servicio }}
        </option>
      </select>
    </div>
    <!-- Mensajes de éxito o error -->
    <div *ngIf="mensajeSuccess" class="mensaje-exito">
      {{ mensajeSuccess }}
    </div>
    <div *ngIf="mensajeError" class="mensaje-error">
      {{ mensajeError }}
    </div>

    <button type="submit" [disabled]="pagoForm.invalid">Registrar Pago</button>
  </form>
</div>
