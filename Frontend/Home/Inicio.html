<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: flex-end;
            padding: 10px;
            background-color: #333;
            color: white;
        }

        .header-left {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #555;
        }

        main {
            padding: 20px;
        }

        .carousel {
            display: flex;
            overflow: hidden;
            width: 100%;
            height: 50vh; /* Ajuste de altura al 50% del viewport */
            position: relative;
        }

        .carousel-item {
            min-width: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Asegura que las imágenes ocupen todo el contenedor */
            display: block;
        }

        .obras {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            margin-top: 20px;
        }

        .obra-item {
            flex: 1 1 calc(33% - 10px);
            box-sizing: border-box;
            background-color: #f9f9f9;
            padding: 10px;
            text-align: center;
        }

        .obra-item img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: row;
            }

            .header-left {
                justify-content: space-between;
                width: 100%;
            }

            .btn {
                flex: 1;
                text-align: center;
            }

            .carousel {
                height: auto;
            }

            .obras {
                flex-direction: column;
            }

            .obra-item {
                flex: 1 1 100%;
            }
        }

        /* Estilos para los formularios flotantes */
        .modal {
            display: none; /* Oculto por defecto */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 400px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .modal-content form {
            display: flex;
            flex-direction: column;
        }

        .modal-content label {
            margin-bottom: 5px;
        }

        .modal-content input {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .modal-content button {
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .modal-content button:hover {
            background-color: #555;
        }

        .modal-content a {
            color: #007BFF;
            text-decoration: none;
            font-size: 0.9em;
        }

        .modal-content a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <button class="btn" id="registerBtn">Registrarse</button>
            <button class="btn" id="loginBtn">Iniciar Sesión</button>
        </div>
    </header>

    <main>
        <section class="carousel">
            <div class="carousel-item">
                <img src="../Imagenes/imagen1.avif" alt="Imagen 1">
            </div>
            <div class="carousel-item">
                <img src="../Imagenes/imagen2.avif" alt= "Imagen 2">
            </div>
            <div class="carousel-item">
                <img src="../Imagenes/imagen3.avif" alt="Imagen 3">
            </div>
        </section>

        <section class="obras">
            <div class="obra-item">
                <img src="obra1.jpg" alt="Obra 1">
                <p>Fecha Inicio: 01/01/2024</p>
                <p>Fecha Fin: 31/01/2024</p>
            </div>
            <div class="obra-item">
                <img src="obra2.jpg" alt="Obra 2">
                <p>Fecha Inicio: 01/02/2024</p>
                <p>Fecha Fin: 28/02/2024</p>
            </div>
            <div class="obra-item">
                <img src="obra3.jpg" alt="Obra 3">
                <p>Fecha Inicio: 01/03/2024</p>
                <p>Fecha Fin: 31/03/2024</p>
            </div>
        </section>
    </main>

    <!-- Formulario de inicio de sesión flotante -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close" id="loginClose">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form>
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required><br>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required><br>
                <button type="submit">Iniciar Sesión</button>
                <a href="#">¿Olvidaste tu contraseña?</a>
            </form>
        </div>
    </div>

    <!-- Formulario de registro flotante -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close" id="registerClose">&times;</span>
            <h2>Registrarse</h2>
            <form>
                <label for="new-username">Usuario:</label>
                <input type="text" id="new-username" name="new-username" required><br>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" name="email" required><br>
                <label for="new-password">Contraseña:</label>
                <input type="password" id="new-password" name="new-password" required><br>
                <button type="submit">Registrarse</button>
            </form>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const items = document.querySelectorAll('.carousel-item');

        function showNextItem() {
            items[currentIndex].style.transform = 'translateX(-100%)';
            currentIndex = (currentIndex + 1) % items.length;
            items[currentIndex].style.transform = 'translateX(0)';
        }

        setInterval(showNextItem, 3000);

        // Mostrar formulario de inicio de sesión
        const loginModal = document.getElementById("loginModal");
        const loginBtn = document.getElementById("loginBtn");
        const loginCloseBtn = document.getElementById("loginClose");

        loginBtn.onclick = function() {
            loginModal.style.display = "flex";
        }

        loginCloseBtn.onclick = function() {
            loginModal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == loginModal) {
                loginModal.style.display = "none";
            }
        }

        // Mostrar formulario de registro
        const registerModal = document.getElementById("registerModal");
        const registerBtn = document.getElementById("registerBtn");
        const registerCloseBtn = document.getElementById("registerClose");

        registerBtn.onclick = function() {
            registerModal.style.display = "flex";
        }

        registerCloseBtn.onclick = function() {
            registerModal.style.display = "none";
        }

        window.onclick = function(event) {
            if (event.target == registerModal) {
                registerModal.style.display = "none";
            }
        }
    </script>
</body>
</html>
