<form (ngSubmit)="actualizarTarea()">
  <!-- Título de la tarea -->
  <label for="titulo">Título de la tarea</label>
  <input id="titulo" [(ngModel)]="titulo" name="titulo" required>

  <!-- Descripción de la tarea -->
  <label for="descripcion">Descripción de la tarea</label>
  <textarea id="descripcion" [(ngModel)]="descripcion" name="descripcion" required></textarea>

  <!-- Fecha inicio -->
  <label for="fechaInicio">Fecha de inicio</label>
  <input type="date" id="fechaInicio" [(ngModel)]="fechaInicio" name="fechaInicio" required>

  <!-- Fecha fin -->
  <label for="fechaFin">Fecha de fin</label>
  <input type="date" id="fechaFin" [(ngModel)]="fechaFin" name="fechaFin" required>

  <!-- Precio total -->
  <label for="precioTotal">Precio total</label>
  <input type="number" id="precioTotal" [(ngModel)]="precioTotal" name="precioTotal" required>

  <!-- Selección de colaborador -->
  <label for="colaboradorSeleccionado">Colaborador</label>
  <select id="colaboradorSeleccionado" [(ngModel)]="colaboradorSeleccionado" name="colaboradorSeleccionado">
    <option *ngFor="let colaborador of colaboradores" [value]="colaborador.id">{{ colaborador.nombre }}</option>
  </select>
  <button type="button" (click)="agregarColaborador()">Agregar Colaborador</button>

  <!-- Selección de herramienta -->
  <label for="herramientaSeleccionada">Herramienta</label>
  <select id="herramientaSeleccionada" [(ngModel)]="herramientaSeleccionada" name="herramientaSeleccionada">
    <option *ngFor="let herramienta of herramientas" [value]="herramienta.id">{{ herramienta.descripcion }}</option>
  </select>

  <label for="vehiculoSeleccionado">Vehiculo</label>
  <select id="vehiculoSeleccionado" [(ngModel)]="vehiculoSeleccionado" name="vehiculoSeleccionado">
    <option *ngFor="let vehiculo of vehiculos" [value]="vehiculo.id">{{ vehiculo.descripcion }}</option>
  </select>
  <button type="button" (click)="agregarHerramienta()">Agregar Herramienta</button>

  <!-- Selección de material -->
  <label for="materialSeleccionado">Material</label>
  <select id="materialSeleccionado" [(ngModel)]="materialSeleccionado" name="materialSeleccionado">
    <option *ngFor="let material of materiales" [value]="material.id">{{ material.nombre }}</option>
  </select>

  <label for="cantidadUtilizada">Cantidad utilizada</label>
  <input type="number" id="cantidadUtilizada" [(ngModel)]="cantidadUtilizada" name="cantidadUtilizada">

  <label for="cantidadNoUtilizada">Cantidad no utilizada</label>
  <input type="number" id="cantidadNoUtilizada" [(ngModel)]="cantidadNoUtilizada" name="cantidadNoUtilizada">

  <button type="button" (click)="agregarMaterial()">Agregar Material</button>

  <!-- Botón para actualizar la tarea -->
  <button type="submit">Actualizar Tarea</button>
</form>
