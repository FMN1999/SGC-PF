<div class="register-container">
  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <h3>Registro de Cliente en Empresa</h3>

    <div class="form-row">
      <div class="form-group">
        <label for="nombre_usuario">Usuario: <span class="required-asterisk">*</span></label>
        <input id="nombre_usuario" formControlName="nombre_usuario" type="text" required />
      </div>

      <div class="form-group">
        <label for="password">Contraseña: <span class="required-asterisk">*</span></label>
        <input id="password" formControlName="password" type="password" required />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="nombre">Nombre: <span class="required-asterisk">*</span></label>
        <input id="nombre" formControlName="nombre" type="text" required />
      </div>

      <div class="form-group">
        <label for="apellido">Apellido: <span class="required-asterisk">*</span></label>
        <input id="apellido" formControlName="apellido" type="text" required />
      </div>
    </div>

    <div class="form-group">
      <label for="email">Email: <span class="required-asterisk">*</span></label>
      <input id="email" formControlName="email" type="email" required />
    </div>

    <div class="form-group">
      <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
      <input id="fecha_nacimiento" formControlName="fecha_nacimiento" type="date" />
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="celular">Celular:</label>
        <input id="celular" formControlName="celular" type="text" />
      </div>

      <div class="form-group">
        <label for="telefono">Teléfono:</label>
        <input id="telefono" formControlName="telefono" type="text" />
      </div>
    </div>

    <div class="form-group">
      <label for="direccion">Dirección:</label>
      <input id="direccion" formControlName="direccion" type="text" />
    </div>

    <div class="form-group">
      <label for="ciudad">Ciudad: <span class="required-asterisk">*</span></label>
      <input id="ciudad" formControlName="ciudad" type="text" required />
    </div>

    <div class="form-group">
      <label for="provincia">Provincia: <span class="required-asterisk">*</span></label>
      <input id="provincia" formControlName="provincia" type="text" required />
    </div>

    <div class="form-group">
      <label for="cuit">CUIT:</label>
      <input id="cuit" formControlName="cuit" type="text" />
    </div>

    <div class="form-group">
      <label for="empresa">Empresa: <span class="required-asterisk">*</span></label>
      <select id="empresa" formControlName="empresa" required>
        <option *ngFor="let empresa of empresas" [value]="empresa.id">{{ empresa.denominacion }}</option>
      </select>
    </div>

    <div class="actions">
      <button type="submit" class="btn-registrar" [disabled]="registerForm.invalid">Registrar</button>
    </div>
    <div *ngIf="mensajeSuccess" class="mensaje-exito">
      {{ mensajeSuccess }}
    </div>
    <div *ngIf="mensajeError" class="mensaje-error">
      {{ mensajeError }}
    </div>
  </form>
</div>
