<div class="container">
  <h2>Detalles de la Obra</h2>

  <form [formGroup]="obraForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="direccion">Dirección:</label>
      <input id="direccion" formControlName="direccion" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="id_cliente">Cliente:</label>
      <input id="id_cliente" formControlName="id_cliente" class="form-control" readonly />
    </div>

    <div class="form-group">
      <label for="telefono_contacto">Teléfono de contacto:</label>
      <input id="telefono_contacto" formControlName="telefono_contacto" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="fecha_inicio_est">Fecha de inicio estimada:</label>
      <input id="fecha_inicio_est" type="date" formControlName="fecha_inicio_est" class="form-control" readonly />
    </div>

    <div class="form-group">
      <label for="fecha_fin_est">Fecha de fin estimada:</label>
      <input id="fecha_fin_est" type="date" formControlName="fecha_fin_est" class="form-control" readonly />
    </div>

    <div class="form-group">
      <label for="fecha_inicio_real">Fecha de inicio real:</label>
      <input id="fecha_inicio_real" type="date" formControlName="fecha_inicio_real" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="fecha_fin_real">Fecha de fin real:</label>
      <input id="fecha_fin_real" type="date" formControlName="fecha_fin_real" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="monto_total_est">Monto total estimado:</label>
      <input id="monto_total_est" formControlName="monto_total_est" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="monto_total_real">Monto total real:</label>
      <input id="monto_total_real" formControlName="monto_total_real" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="moneda">Moneda:</label>
      <input id="moneda" formControlName="moneda" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="pisos">Pisos:</label>
      <input id="pisos" formControlName="pisos" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="dimensions">Dimensiones:</label>
      <input id="dimensions" formControlName="dimensions" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="estado">Estado:</label>
      <input id="estado" formControlName="estado" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="ganancias">Ganancias:</label>
      <input id="ganancias" formControlName="ganancias" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="form-group">
      <label for="perdidas">Pérdidas:</label>
      <input id="perdidas" formControlName="perdidas" class="form-control" [readonly]="!editMode" />
    </div>

    <div class="mt-3">
      <!-- Botón para habilitar o deshabilitar el modo de edición -->
      <button type="button" class="btn btn-primary" (click)="toggleEditMode()">
        {{ editMode ? 'Cancelar edición' : 'Editar' }}
      </button>

      <!-- Botón para guardar los cambios, solo visible en modo de edición -->
      <button type="submit" class="btn btn-success" [disabled]="!editMode">
        Guardar cambios
      </button>
    </div>
  </form>
</div>
