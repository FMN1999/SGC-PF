<app-header></app-header>

<div class="solicitudes-container">
  <h1>Solicitudes / Compras</h1>

  <!-- Contenedor de filtros -->
  <div class="filtros">
    <input
      type="text"
      placeholder="Buscar solicitudes..."
      [(ngModel)]="filtroBusqueda"
      (input)="aplicarFiltros()"
      class="busqueda"
    />
    <select [(ngModel)]="filtroEstado" (change)="aplicarFiltros()" class="estado-filtro">
      <option value="">Todos los Estados</option>
      <option *ngFor="let estado of estadosCompras" [value]="estado">
        {{ estado }}
      </option>
    </select>
  </div>

  <!-- Sección de solicitudes por estado -->
  <div *ngIf="tieneSolicitudesFiltradas(); else noSolicitudes">
    <div *ngFor="let estado of estadosFiltrados" class="estado-section">
      <h2 class="titulo">Compras: {{ estado }}{{ 'aeiou'.includes(estado[estado.length - 1]) ? 's' : '' }}</h2>
      <ul class="lista-solicitudes">
        <li *ngFor="let solicitud of solicitudesFiltradas[estado]" class="solicitud-item">
          <a [routerLink]="['/compra', solicitud.id]" class="solicitud-link">
            <div class="detalle">
              <p><strong>Fecha de Compra:</strong> {{ solicitud.fecha }}</p>
              <p><strong>Monto Total:</strong> {{ solicitud.monto }}</p>
              <p><strong>Proveedor:</strong> {{ solicitud.proveedor }}</p>
            </div>
          </a>
        </li>
      </ul>
    </div>
  </div>

  <!-- Template para cuando no hay solicitudes -->
  <ng-template #noSolicitudes>
    <div class="no-solicitudes">
      <p>No se encontraron solicitudes para los filtros aplicados.</p>
    </div>
  </ng-template>
</div>
