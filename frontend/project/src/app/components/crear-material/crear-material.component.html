<app-header></app-header>
<div class="crear-material-container">
  <h1>Crear Material</h1>
  <form (ngSubmit)="crearMaterial()">
    <div class="form-group">
      <label for="tipo_material">Denominación:</label>
      <input id="tipo_material" [(ngModel)]="materialData.tipo_material" name="tipo_material" required />
    </div>

    <div class="form-group">
      <label for="unidad_medida">Unidad de Medida:</label>
      <input id="unidad_medida" [(ngModel)]="materialData.unidad_medida" name="unidad_medida" required />
    </div>

    <div class="form-group">
      <label for="descripcion">Descripción:</label>
      <textarea id="descripcion" [(ngModel)]="materialData.descripcion" name="descripcion" required></textarea>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="marca">Marca:</label>
        <input id="marca" [(ngModel)]="materialData.marca" name="marca" required />
      </div>

      <div class="form-group">
        <label for="precio">Precio:</label>
        <input id="precio" [(ngModel)]="materialData.precio" name="precio" type="number" step="0.01" />
      </div>

      <div class="form-group">
        <label for="moneda">Moneda:</label>
        <input id="moneda" [(ngModel)]="materialData.moneda" name="moneda" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="fecha_desde_precio">Fecha Desde Precio:</label>
        <input id="fecha_desde_precio" [(ngModel)]="materialData.fecha_desde_precio" name="fecha_desde_precio" type="date"/>
      </div>

      <div class="form-group">
        <label for="impuestos_total">Impuestos:</label>
        <input id="impuestos_total" [(ngModel)]="materialData.impuestos_total" name="impuestos_total" type="number" step="0.01"/>
      </div>

      <div class="form-group">
        <label for="moneda_impuestos">Moneda Impuestos:</label>
        <input id="moneda_impuestos" [(ngModel)]="materialData.moneda_impuestos" name="moneda_impuestos"/>
      </div>
    </div>

    <div class="form-group">
      <label for="descripcion_impuestos">Descripción Impuestos:</label>
      <textarea id="descripcion_impuestos" [(ngModel)]="materialData.descripcion_impuestos" name="descripcion_impuestos"></textarea>
    </div>

    <div class="form-group">
      <label for="otros_gastos">Otros gastos:</label>
      <input id="otros_gastos" [(ngModel)]="materialData.otros_gastos" name="otros_gastos" type="number" step="0.01"/>
    </div>

    <div class="form-group">
      <label for="moneda_otros_gastos">Moneda de Otros gastos:</label>
      <input id="moneda_otros_gastos" [(ngModel)]="materialData.moneda_otros_gastos" name="moneda_otros_gastos"/>
    </div>


    <div class="form-group">
      <label for="descripcion_otros_gastos">Descripción de otros gastos:</label>
      <textarea id="descripcion_otros_gastos" [(ngModel)]="materialData.descripcion_otros_gastos" name="descripcion_otros_gastos"></textarea>
    </div>

    <div class="form-group">
      <label>Asociar con:</label>
      <select [(ngModel)]="tipoAsociacion" name="tipoAsociacion">
        <option value="">Ninguno</option>
        <option value="vehiculo">Vehículo</option>
        <option value="herramienta">Herramienta</option>
      </select>
    </div>

    <div *ngIf="tipoAsociacion === 'vehiculo'" class="association-form">
      <h2>Datos del Vehículo</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="patente">Patente:</label>
          <input id="patente" [(ngModel)]="vehiculoData.patente" name="patente" />
        </div>

        <div class="form-group">
          <label for="tipo">Tipo:</label>
          <input id="tipo" [(ngModel)]="vehiculoData.tipo" name="tipo" />
        </div>

        <div class="form-group">
          <label for="modelo">Modelo:</label>
          <input id="modelo" [(ngModel)]="vehiculoData.modelo" name="modelo" />
        </div>

        <div class="form-group">
          <label for="precio_x_hora">Precio por hora:</label>
          <input id="precio_x_hora" [(ngModel)]="vehiculoData.precio_x_hora" name="precio_x_hora" type="number" step="0.01" />
        </div>

        <div class="form-group">
          <label for="moneda_vehiculo">Moneda de Otros gastos:</label>
          <input id="moneda_vehiculo" [(ngModel)]="vehiculoData.moneda" name="moneda_vehiculo"/>
        </div>

        <div class="form-group">
          <label>Almacen</label>
          <select [(ngModel)]="vehiculoData.id_almacen" id="id_almacen" formControlName="id_almacen">
            <option value="">Seleccione un almacén</option>
            <option *ngFor="let almacen of almacenes" [value]="almacen.id">
              {{ almacen.descripcion }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <div *ngIf="tipoAsociacion === 'herramienta'" class="association-form">
      <h2>Datos de la Herramienta</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="ubicacion">Ubicación:</label>
          <input id="ubicacion" [(ngModel)]="herramientaData.ubicacion" name="ubicacion" />
        </div>

        <div class="form-group">
          <label>Almacen</label>
          <select [(ngModel)]="herramientaData.id_almacen" id="id_almacenh" formControlName="id_almacenh">
            <option value="">Seleccione un almacén</option>
            <option *ngFor="let almacen of almacenes" [value]="almacen.id">
              {{ almacen.descripcion }}
            </option>
          </select>
        </div>
      </div>
    </div>

    <button class="submit-btn" type="submit">Crear Material</button>
  </form>
  <div *ngIf="mensajeError" class="error">{{ mensajeError }}</div>
  <div *ngIf="mensajeSuccess" class="success">{{ mensajeSuccess }}</div>
</div>
