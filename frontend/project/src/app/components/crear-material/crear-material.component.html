<h1>Crear Material</h1>
<form (ngSubmit)="crearMaterial()">

  <label for="tipo_material">Tipo de Material:</label>
  <input id="tipo_material" [(ngModel)]="materialData.tipo_material" name="tipo_material" required>

  <label for="unidad_medida">Unidad de Medida:</label>
  <input id="unidad_medida" [(ngModel)]="materialData.unidad_medida" name="unidad_medida" required>

  <label for="descripcion">Descripción:</label>
  <input id="descripcion" [(ngModel)]="materialData.descripcion" name="descripcion" required>

  <label for="marca">Marca:</label>
  <input id="marca" [(ngModel)]="materialData.marca" name="marca" required>

  <label for="precio">Precio:</label>
  <input id="precio" [(ngModel)]="materialData.precio" name="precio" required type="number" step="0.01">

  <label for="moneda">Moneda:</label>
  <input id="moneda" [(ngModel)]="materialData.moneda" name="moneda" required>

  <label for="fecha_desde_precio">Fecha Desde Precio:</label>
  <input id="fecha_desde_precio" [(ngModel)]="materialData.fecha_desde_precio" name="fecha_desde_precio" required type="date">

  <label for="impuestos_total">Impuestos:</label>
  <input id="impuestos_total" [(ngModel)]="materialData.impuestos_total" name="impuestos_total" required type="number" step="0.01">

  <label for="moneda_impuestos">Moneda Impuestos:</label>
  <input id="moneda_impuestos" [(ngModel)]="materialData.moneda_impuestos" name="moneda_impuestos" required>

  <label for="descripcion_impuestos">Descripción de Impuestos:</label>
  <input id="descripcion_impuestos" [(ngModel)]="materialData.descripcion_impuestos" name="descripcion_impuestos" required>

    <label for="otros_gastos">Otros gastos:</label>
  <input id="otros_gastos" [(ngModel)]="materialData.otros_gastos" name="otros_gastos" required type="number" step="0.01">

  <label for="moneda_otros_gastos">Moneda Otros Gastos:</label>
  <input id="moneda_otros_gastos" [(ngModel)]="materialData.moneda_otros_gastos" name="moneda_otros_gastos" required>

  <label for="descripcion_otros_gastos">Descripción de Otros Gastos:</label>
  <input id="descripcion_otros_gastos" [(ngModel)]="materialData.descripcion_otros_gastos" name="descripcion_otros_gastos" required>
  <button type="submit">Crear Material</button>
</form>

<p *ngIf="mensajeExito">{{ mensajeExito }}</p>
<p *ngIf="mensajeError">{{ mensajeError }}</p>
