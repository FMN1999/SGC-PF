<app-header></app-header>

<div *ngIf="loading" class="loading">
  Cargando empresas...
</div>

<div *ngIf="error" class="error">
  {{ error }}
</div>

<div *ngIf="!loading && !error">
  <div class="container">
    <h2>Listado de Empresas</h2>
    <button (click)="irACrearEmpresa()" class="create-button">Crear Nueva Empresa</button>
    <table class="empresas-table">
      <thead>
        <tr>
          <th>Denominación</th>
          <th>CUIT</th>
          <th>Teléfono</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let empresa of empresas">
          <td>{{ empresa.denominacion }}</td>
          <td>{{ empresa.cuit }}</td>
          <td>{{ empresa.telefono }}</td>
          <td>{{ empresa.email }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
