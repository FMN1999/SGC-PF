<app-header></app-header>
<div class="crear-proveedor-container">
  <h1>Crear Proveedor</h1>
  <form [formGroup]="proveedorForm" (ngSubmit)="onSubmit()">
    <div *ngIf="mensajeError" class="error-message">{{ mensajeError }}</div>

    <div class="form-group">
      <label for="denominacion">Denominación</label>
      <input id="denominacion" formControlName="denominacion" type="text" required />
    </div>

    <div class="form-group">
      <label for="telefono">Teléfono</label>
      <input id="telefono" formControlName="telefono" type="text" required />
    </div>

    <div class="form-group">
      <label for="direccion">Dirección</label>
      <input id="direccion" formControlName="direccion" type="text" required />
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" formControlName="email" type="email" required />
    </div>

    <div class="form-group">
      <label for="cuil">CUIL</label>
      <input id="cuil" formControlName="cuil" type="text" required />
    </div>

    <div class="form-group">
      <label for="ciudad">Ciudad</label>
      <input id="ciudad" formControlName="ciudad" type="text" required />
    </div>

    <div class="form-group">
      <label for="provincia">Provincia</label>
      <input id="provincia" formControlName="provincia" type="text" required />
    </div>

    <button type="submit" class="submit-btn">Crear Proveedor</button>
  </form>
</div>
