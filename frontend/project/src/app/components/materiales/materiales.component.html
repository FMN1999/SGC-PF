<app-header></app-header>

<div class="materiales-container">
  <div *ngIf="materiales.length > 0; else noMateriales">
    <h1>Lista de Materiales</h1>
    <ul class="materiales-list">
      <li *ngFor="let material of materiales" class="material-item">
        <a [routerLink]="['/material', material.id]" class="material-link">
          {{ material.descripcion }} - {{ material.marca }} ({{ material.precio }} {{ material.moneda }})
        </a>
      </li>
    </ul>
  </div>

  <ng-template #noMateriales>
    <p class="no-materiales-message">No se encontraron materiales para esta empresa.</p>
  </ng-template>
</div>
