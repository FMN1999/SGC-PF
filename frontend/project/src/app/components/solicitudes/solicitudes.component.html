<app-header></app-header>

<div class="solicitudes-container">
  <!-- Iteramos sobre los estados disponibles -->
  <div *ngFor="let estado of estadosCompras" class="estado-section">
    <h2 class="titulo">Compras: {{ estado }}s</h2>

    <!-- Lista de solicitudes para el estado actual -->
    <ul class="lista-solicitudes">
      <li *ngFor="let solicitud of solicitudesPorEstado[estado]" class="solicitud-item">
        <a [routerLink]="['/compra', solicitud.id]" class="solicitud-link">
          <div class="detalle">
            <p><strong>ID de Compra:</strong> {{ solicitud.id }}</p>
            <p><strong>Fecha de Compra:</strong> {{ solicitud.fecha }}</p>
            <p><strong>Monto Total:</strong> {{ solicitud.monto }}</p>
            <p><strong>Proveedor:</strong> {{ solicitud.proveedor }}</p>
            <!-- Otros campos relevantes -->
          </div>
        </a>
      </li>
    </ul>
  </div>

  <!-- Template para cuando no hay solicitudes -->
  <ng-template #noSolicitudes>
    <div class="no-solicitudes">
      <p>No hay solicitudes disponibles.</p>
    </div>
  </ng-template>
</div>
