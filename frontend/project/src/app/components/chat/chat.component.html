<div class="chat-container">
  <div class="chat-box">
    <div class="messages" *ngFor="let message of messages">
      <div class="message" [ngClass]="{ 'user-message': message.isUser, 'bot-message': !message.isUser }">
        {{ message.text }}
      </div>
    </div>
  </div>

  <form (ngSubmit)="sendMessage()" class="message-input-form">
    <input type="text" [(ngModel)]="userMessage" name="userMessage" placeholder="Escribe tu pregunta..." required />
    <button type="submit">Enviar</button>
  </form>
</div>
