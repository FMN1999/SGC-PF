<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: flex-end;
            padding: 10px;
            background-color: #333;
            color: white;
        }

        .header-left {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #444;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        main {
            padding: 20px;
        }

        .carousel {
            display: flex;
            overflow: hidden;
            width: 100%;
            max-width: 100%;
            height: auto;
            position: relative;
        }

        .carousel-item {
            min-width: 100%;
            transition: transform 0.5s ease-in-out;
        }

        .carousel-item img {
            width: 100%;
            display: block;
        }

        .obras {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            margin-top: 20px;
        }

        .obra-item {
            flex: 1 1 calc(33% - 10px);
            box-sizing: border-box;
            background-color: #f9f9f9;
            padding: 10px;
            text-align: center;
        }

        .obra-item img {
            max-width: 100%;
            height: auto;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: row;
            }

            .header-left {
                justify-content: space-between;
                width: 100%;
            }   

            .carousel-item {
                min-width: 100%;
            }

            .obras {
                flex-direction: column;
            }

            .obra-item {
                flex: 1 1 100%;
            }
            
            .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <button class="btn">Registrarse</button>
            <button class="btn">Iniciar Sesión</button>
        </div>
    </header>

    <main>
        <section class="carousel">
            <div class="carousel-item">
                <img src="../Imagenes/imagen1.avif" alt="Imagen 1">
            </div>
            <div class="carousel-item">
                <img src="../Imagenes/imagen2.avif" alt="Imagen 2">
            </div>
            <div class="carousel-item">
                <img src="../Imagenes/imagen3.avif" alt="Imagen 3">
            </div>
        </section>

        <section class="obras">
            <div class="obra-item">
                <img src="obra1.jpg" alt="Obra 1">
                <p>Fecha Inicio: 01/01/2024</p>
                <p>Fecha Fin: 31/01/2024</p>
            </div>
            <div class="obra-item">
                <img src="obra2.jpg" alt="Obra 2">
                <p>Fecha Inicio: 01/02/2024</p>
                <p>Fecha Fin: 28/02/2024</p>
            </div>
            <div class="obra-item">
                <img src="obra3.jpg" alt="Obra 3">
                <p>Fecha Inicio: 01/03/2024</p>
                <p>Fecha Fin: 31/03/2024</p>
            </div>
        </section>
    </main>

    <script>
        let currentIndex = 0;
        const items = document.querySelectorAll('.carousel-item');

        function showNextItem() {
            items[currentIndex].style.transform = 'translateX(-100%)';
            currentIndex = (currentIndex + 1) % items.length;
            items[currentIndex].style.transform = 'translateX(0)';
        }

        setInterval(showNextItem, 3000);
    </script>
</body>
</html>
