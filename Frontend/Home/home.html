<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantalla de Módulos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #333;
            color: white;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
        }

        .user-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        main {
            padding: 20px;
        }

        .modules {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
        }

        .module {
            flex: 1 1 calc(25% - 10px); /* 4 módulos por línea en monitor */
            box-sizing: border-box;
            background-color: #f9f9f9;
            padding: 40px 20px; /* Incrementa la altura del módulo */
            text-align: center;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s, background-color 0.3s;
        }

        .module:hover {
            transform: translateY(-5px);
            background-color: #e9e9e9;
        }

        @media (max-width: 768px) {
            .modules {
                justify-content: space-around;
            }

            .module {
                flex: 1 1 calc(50% - 10px); /* 2 módulos por línea en móviles */
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Baker</div>
        <div class="user-icon" onclick="location.href='user-profile.html';">
            <img src="user-icon.png" alt="User Icon" style="width: 100%; height: 100%; border-radius: 50%;">
        </div>
    </header>

    <main>
        <div class="modules">
            <div class="module" onclick="location.href='modulo1.html';">Módulo 1</div>
            <div class="module" onclick="location.href='modulo2.html';">Módulo 2</div>
            <div class="module" onclick="location.href='modulo3.html';">Módulo 3</div>
            <div class="module" onclick="location.href='modulo4.html';">Módulo 4</div>
            <div class="module" onclick="location.href='modulo5.html';">Módulo 5</div>
            <div class="module" onclick="location.href='modulo6.html';">Módulo 6</div>
            <div class="module" onclick="location.href='modulo7.html';">Módulo 7</div>
            <div class="module" onclick="location.href='modulo8.html';">Módulo 8</div>
        </div>
    </main>
</body>
</html>
