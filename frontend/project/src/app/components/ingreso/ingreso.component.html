<app-header></app-header>

<div class="ingreso-container">
  <form [formGroup]="ingresoForm" (ngSubmit)="onSubmit()">
    <div formArrayName="ingresos" class="ingresos-section">
      <div *ngFor="let ingreso of ingresos.controls; let i = index" [formGroupName]="i" class="ingreso-item">
        <h3>Ingreso {{ i + 1 }}</h3>

        <!-- Material -->
        <div class="form-group">
          <label for="material-{{i}}">Material:</label>
          <select formControlName="id_material" id="material-{{i}}" required>
            <option *ngFor="let material of materialesDisponibles" [value]="material.id_material">
              {{ material.material }}
            </option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="cantidad-{{i}}">Cantidad:</label>
            <input formControlName="cantidad" id="cantidad-{{i}}" type="number" required/>
          </div>

          <!-- Unidad de Medida -->
          <div class="form-group">
            <label for="unidadMedida-{{i}}">Unidad de Medida:</label>
            <input formControlName="unidadMedida" id="unidadMedida-{{i}}" readonly required/>
          </div>
        </div>

        <div class="form-row">
          <!-- Fecha de Ingreso -->
          <div class="form-group">
            <label for="fecha-{{i}}">Fecha de Ingreso (estimado):</label>
            <input formControlName="fecha" id="fecha-{{i}}" type="date" />
          </div>

          <!-- Fecha Real -->
          <div class="form-group">
            <label for="fechaReal-{{i}}">Fecha Real:</label>
            <input formControlName="fechaReal" id="fechaReal-{{i}}" type="date" />
          </div>
        </div>

        <!-- Almacén -->
        <div class="form-group">
          <label for="almacen-{{i}}">Almacén:</label>
          <select formControlName="id_almacen" id="almacen-{{i}}">
            <option *ngFor="let almacen of almacenes" [value]="almacen.id">
              {{ almacen.descripcion }}
            </option>
          </select>
        </div>

        <!-- Material en Obra -->
        <div class="form-group">
          <label for="enObra-{{i}}">¿Se lleva el material a la obra?</label>
          <input formControlName="en_obra" id="enObra-{{i}}" type="checkbox" />
        </div>

        <!-- Realizado -->
        <div class="form-group">
          <label for="realizado-{{i}}">Realizado:</label>
          <input formControlName="realizado" id="realizado-{{i}}" type="checkbox" />
        </div>

        <div class="form-group buttons">
          <button type="button" class="btn-danger" [disabled]="ingresos.length === 1" (click)="eliminarIngreso(i)">Eliminar Ingreso</button>
          <button type="button" class="btn-secondary" (click)="particionar(materialesDisponibles[i].id_material, materialesDisponibles[i].material, materialesDisponibles[i].unidad_medida)">Particionar</button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <button type="submit" class="btn-primary" [disabled]="ingresoForm.invalid">Guardar Ingresos</button>
    </div>
  </form>
  <div *ngIf="mensajeError" class="error-message">
    {{ mensajeError }}
  </div>
  <div *ngIf="mensajeExito" class="success-message">
    {{ mensajeExito }}
  </div>
</div>
