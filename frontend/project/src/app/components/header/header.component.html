<header class="generic-header">
  <div class="left-section">
    <fa-icon [icon]="['fas', 'home']" class="icon-btn" (click)="irAlHome()"></fa-icon>
  </div>

  <div class="right-section">
    <fa-icon [icon]="['fas', 'user']" class="icon-btn" (click)="toggleUserMenu()"></fa-icon>
    <ul class="user-menu" *ngIf="userMenuVisible">
      <li (click)="irAlPerfil()">Mi Perfil</li>
      <li (click)="cerrarSesion()">Cerrar Sesión</li>
    </ul>
  </div>
</header>
