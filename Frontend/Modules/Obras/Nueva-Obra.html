<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Obras</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            padding: 10px;
            text-align: center;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        header a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            margin: 0 10px;
            font-size: 16px;
        }

        header a:hover {
            background-color: #555;
        }

        .menu-icon {
            font-size: 1.5em;
            cursor: pointer;
            color: #fff;
        }

        .user-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .user-icon img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        .obra-section {
            width: 70%;
            padding: 20px;
            box-sizing: border-box;
            background-color: #fff;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .area-section {
            background-color: #f0f0f0; /* Color de fondo gris para la sección de áreas */
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        h2, h3 {
            color: #333;
        }

        label {
            margin-top: 10px;
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        .tab {
            overflow: hidden;
            border: 1px solid #ccc;
            background-color: #f1f1f1;
            margin-top: 10px;
            border-radius: 8px;
        }

        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 10px 20px;
            transition: 0.3s;
            border-radius: 8px 8px 0 0;
        }

        .tab button:hover {
            background-color: #ddd;
        }

        .tab button.active {
            background-color: #ccc;
        }

        .tabcontent {
            display: none;
            padding: 6px 12px;
            border-top: none;
        }

        .tabcontent.active {
            display: block;
        }

        .avances-button {
            margin-top: 10px;
            text-align: center;
        }

        .avances-button button {
            background-color: #007BFF;
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .avances-button button:hover {
            background-color: #0056b3;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center; /* Centra los elementos dentro del contenedor */
        }

        .file-list-item {
            margin: 10px;
            width: 150px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-sizing: border-box;
            background-color: #e9ecef; /* Color de fondo para cada archivo */
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .file-list-item a {
            text-decoration: none;
            color: #007BFF;
        }

        .file-list-item:hover {
            background-color: #d3d9df; /* Cambia el color de fondo al pasar el mouse */
        }

        .file-input {
            display: none; /* Oculta el input de tipo file por defecto */
        }

        .file-container {
            background-color: #007BFF; /* Color de fondo del contenedor destacado */
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .file-container:hover {
            background-color: #0056b3; /* Cambia el color de fondo al pasar el mouse */
        }

        #content {
            padding: 20px;
            text-align: center;
        }

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #f1f1f1;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        @media (max-height: 450px) {
            .sidebar {padding-top: 15px;}
            .sidebar a {font-size: 18px;}
        }
    </style>
</head>
<body>

    <header>
        <div class="menu-icon" onclick="openNav()">&#9776;</div>
        <div class="header-right">
            <div class="user-icon" onclick="location.href='../PerfilUsuario/perfil.html';">
                <img src="user-icon.png" alt="User Icon">
            </div>
        </div>
    </header>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="../../Home/home.html">Inicio</a>
        <a href="../../Modules/Horas/Asignar_horas.html">Asignar horas</a>
        <a href="../../Modules/Horas/Cargar_horas.html">Cargas horas</a>
        <a href="../../Modules/Obras/Listado_obras.html">Obras</a>
        <a href="../../Modules/Movimientos.html">Movimientos</a>
        <a href="../../Modules/Compras.html">Compras</a>
        <!-- Agrega más enlaces a módulos según sea necesario -->
    </div>

    <div class="obra-section">
        <h2>Datos de la Obra</h2>
        <a href="../../Modules/Avances.html" class="avances-button">
            <button>Avances</button>
        </a>
        <label for="direccion">Dirección:</label>
        <input type="text" id="direccion" placeholder="Ingrese la dirección">

        <label for="dueno">Dueño:</label>
        <input type="text" id="dueno" placeholder="Ingrese el nombre del dueño">

        <label for="telefono">Teléfono de contacto:</label>
        <input type="text" id="telefono" placeholder="Ingrese el teléfono de contacto">

        <div class="area-section">
            <h2>Áreas</h2>

            <div class="tab">
                <button class="tablinks active" onclick="openTab(event, 'area1')">Área 1</button>
                <button class="add-tab-button" onclick="addTab()">+ Agregar Área</button>
                <!-- Agrega más botones de solapas según sea necesario -->
            </div>

            <div id="area1" class="tabcontent active">
                <h3>Área 1</h3>
                <label for="caracteristicasArea1">Características:</label>
                <textarea id="caracteristicasArea1" placeholder="Ingrese las características del Área 1"></textarea>
                <ul id="fileListArea1" class="file-list">
                    <!-- Aquí se mostrarán los archivos cargados por el usuario para el Área 1 -->
                </ul>
                <div class="file-container" onclick="document.querySelector('.file-input').click()">Cargar Archivo</div>
                <input type="file" class="file-input" onchange="uploadFile('fileListArea1')">
            </div>

            <!-- Agregar más áreas según sea necesario -->

        </div>
    </div>

    <script>
        var tabCount = 1;

        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        function openTab(evt, areaName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(areaName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        function addTab() {
            tabCount++;
            var newTabButton = document.createElement('button');
            newTabButton.className = 'tablinks';
            newTabButton.innerHTML = 'Área ' + tabCount;
            newTabButton.onclick = function() {
                openTab(event, 'area' + tabCount);
            };

            var newTabContent = document.createElement('div');
            newTabContent.id = 'area' + tabCount;
            newTabContent.className = 'tabcontent';
            newTabContent.style.display = 'none';
            newTabContent.innerHTML = `
                <h3>Área ${tabCount}</h3>
                <label for="caracteristicasArea${tabCount}">Características:</label>
                <textarea id="caracteristicasArea${tabCount}" placeholder="Ingrese las características del Área ${tabCount}"></textarea>
                <ul id="fileListArea${tabCount}" class="file-list">
                    <!-- Aquí se mostrarán los archivos cargados por el usuario para el Área ${tabCount} -->
                </ul>
                <div class="file-container" onclick="document.querySelector('.file-input').click()">Cargar Archivo</div>
                <input type="file" class="file-input" onchange="uploadFile('fileListArea${tabCount}')">
            `;

            var tabContainer = document.querySelector('.area-section');
            var tabSection = tabContainer.querySelector('.tab');
            tabSection.insertBefore(newTabButton, tabSection.querySelector('.add-tab-button'));
            tabContainer.appendChild(newTabContent);
            openTab(event, 'area' + tabCount);
        }

        function uploadFile(area) {
            var fileInput = document.querySelector('.file-input');
            var fileList = document.querySelector(`#${area}`);
            var fileName = fileInput.files[0].name;
            var listItem = document.createElement('li');
            listItem.className = 'file-list-item';
            listItem.innerHTML = '<a href="#" download>' + fileName + '</a>';
            fileList.appendChild(listItem);
        }
    </script>

</body>
</html>
