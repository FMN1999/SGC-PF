<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Obras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #333;
            color: white;
        }

        .menu-icon {
            font-size: 1.5em;
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .searchbox {
            padding: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%;
            max-width: 300px;
        }

        .filter-icon, .add-icon {
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px 10px;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .filter-icon:hover, .add-icon:hover {
            background-color: #555;
        }

        .user-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        main {
            padding: 20px;
        }

        .obras {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .obra-item {
            background-color: #f9f9f9;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            left: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }

        .sidebar a {
            padding: 8px 8px 8px 32px;
            text-decoration: none;
            font-size: 25px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }

        .sidebar a:hover {
            color: #f1f1f1;
        }

        .sidebar .closebtn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }

        @media (max-height: 450px) {
            .sidebar {padding-top: 15px;}
            .sidebar a {font-size: 18px;}
        }
    </style>
</head>
<body>
    <header>
        <div class="menu-icon" onclick="openNav()">&#9776;</div>
        <div class="header-right">
            <div class="user-icon" onclick="location.href='user-profile.html';">
                <img src="user-icon.png" alt="User Icon" style="width: 100%; height: 100%; border-radius: 50%;">
            </div>
        </div>
    </header>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="modulo1.html">Módulo 1</a>
        <a href="modulo2.html">Módulo 2</a>
        <a href="modulo3.html">Módulo 3</a>
        <a href="modulo4.html">Módulo 4</a>
        <!-- Agrega más enlaces a módulos según sea necesario -->
    </div>

    <main>
        <div class="search-container">
            <button class="add-icon" onclick="location.href='add-obra.html';">+</button>
            <input type="text" class="searchbox" placeholder="Buscar...">
            <button class="filter-icon" onclick="openFilterModal()">&#x1F50D;</button>
        </div>
        <div class="obras">
            <div class="obra-item">
                <img src="obra1.jpg" alt="Obra 1">
                <p>Fecha Inicio: 01/01/2024</p>
                <p>Fecha Fin: 31/01/2024</p>
            </div>
            <div class="obra-item">
                <img src="obra2.jpg" alt="Obra 2">
                <p>Fecha Inicio: 01/02/2024</p>
                <p>Fecha Fin: 28/02/2024</p>
            </div>
            <div class="obra-item">
                <img src="obra3.jpg" alt="Obra 3">
                <p>Fecha Inicio: 01/03/2024</p>
                <p>Fecha Fin: 31/03/2024</p>
            </div>
            <!-- Agrega más obras según sea necesario -->
        </div>
    </main>

    <script>
        function openNav() {
            document.getElementById("mySidebar").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidebar").style.width = "0";
        }

        function openFilterModal() {
            alert("Aquí puedes abrir un modal para aplicar filtros adicionales.");
            // Implementa la lógica para abrir el modal de filtros
        }
    </script>
</body>
</html>
