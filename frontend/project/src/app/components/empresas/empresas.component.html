<div *ngIf="loading" class="loading">
  Cargando empresas...
</div>

<div *ngIf="error" class="error">
  {{ error }}
</div>

<div *ngIf="!loading && !error">
  <h2>Listado de Empresas</h2>
  <button (click)="irACrearEmpresa()">Crear Nueva Empresa</button>
  <table class="empresas-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Denominación</th>
        <th>CUIT</th>
        <th>Teléfono</th>
        <th>Email</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let empresa of empresas">
        <td>{{ empresa.id }}</td>
        <td>{{ empresa.denominacion }}</td>
        <td>{{ empresa.cuit }}</td>
        <td>{{ empresa.telefono }}</td>
        <td>{{ empresa.email }}</td>
      </tr>
    </tbody>
  </table>
</div>
